<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title }} | {{ site.title }}</title>
    <meta name="description" content="{{ page.description }}" />
    <link rel="stylesheet" href="/assets/style.css" />
    <script src="/assets/components.js"></script>
    {{ include.head_extra }}
  </head>
  <body>
    <ap-navbar data='{{ tree_json }}' current='{{ current_route }}'></ap-navbar>
    <div class="ap-layout">
      <ap-sidebar data='{{ tree_json }}' current='{{ current_route }}'></ap-sidebar>
      <main class="ap-content">
        {{ content }}
      </main>
    </div>
    {{ include.footer }}
  </body>
</html>
