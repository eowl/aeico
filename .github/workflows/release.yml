name: Release

on:
  push:
    tags:
      - '*@*'

permissions:
  contents: write  # for creating GitHub Release
  id-token: write  # required for npm OIDC (Trusted Publishers)

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history for branch check

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Verify tag is on main branch
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "::error::Tag must point to a commit on the main branch."
            exit 1
          fi

      - name: Parse package name and version from tag
        id: parse
        run: |
          TAG="${{ github.ref_name }}"
          PKG_NAME="${TAG%@*}"
          PKG_VERSION="${TAG##*@}"
          echo "pkg_name=$PKG_NAME" >> "$GITHUB_OUTPUT"
          echo "pkg_version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "pkg_dir=packages/$PKG_NAME" >> "$GITHUB_OUTPUT"

      - name: Verify package directory exists
        run: |
          if [ ! -d "${{ steps.parse.outputs.pkg_dir }}" ]; then
            echo "::error::Package directory '${{ steps.parse.outputs.pkg_dir }}' not found."
            exit 1
          fi

      - name: Verify version matches package.json
        run: |
          ACTUAL=$(node -p "require('./${{ steps.parse.outputs.pkg_dir }}/package.json').version")
          EXPECTED="${{ steps.parse.outputs.pkg_version }}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Tag version ($EXPECTED) does not match package.json version ($ACTUAL)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Publish to npm
        run: |
          cd ${{ steps.parse.outputs.pkg_dir }}
          npm publish --access public --provenance

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: ${{ github.ref_name }}
